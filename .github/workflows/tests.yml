name: Regresión Sombra
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependencias de QA Linux
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements-qa-linux-py312.lock
      - name: Dependencias Windows
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements-full.txt pytest
      - name: Regresión con bibliotecas científicas
        run: python -m pytest -q -ra -W error::ResourceWarning -W error::pytest.PytestUnraisableExceptionWarning -p no:cacheprovider
      - name: Ruta sin bibliotecas científicas opcionales
        run: python test/run_optional_fallback.py
